<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Order — SAHN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="headerMount"></div>

<main class="container" style="max-width: 700px; padding-top: 36px; padding-bottom: 60px;">
  <h1 style="font-size: 26px; margin-bottom: 8px;">Track your order</h1>
  <p style="color: var(--muted); font-size: 14.5px; margin-bottom: 24px;">Enter your order number, or look up recent orders by email.</p>

  <div class="form-card" style="margin-bottom: 20px;">
    <div class="coupon-apply-row" style="margin-bottom:0;">
      <input type="text" id="orderIdInput" placeholder="Order number, e.g. 12" />
      <button type="button" id="trackBtn" style="background:var(--accent);">Track</button>
    </div>
  </div>

  <div id="orderResult"></div>
</main>

<div id="footerMount"></div>
<div id="cartDrawerMount"></div>

<script src="partials.js"></script>
<script src="cart.js"></script>
<script src="track.js"></script>
</body>
</html>
